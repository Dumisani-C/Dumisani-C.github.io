<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}Dumisani Chikomo</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/blog/blog.css' | relative_url }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="{{ '/' | relative_url }}">Dumisani Chikomo</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/#experience' | relative_url }}">Experience</a>
          <a href="{{ '/#projects' | relative_url }}">Projects</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {{ content }}
    </main>
  </body>
</html>
