media:
  input: images
  output: /images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: layout
        type: string
        hidden: true
        default: post
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Short summary (shown on the blog page)
        type: string
      - name: body
        label: Post
        type: rich-text
